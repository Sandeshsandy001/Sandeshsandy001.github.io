<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Admin Dashboard | Sandesh</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      padding: 30px 20px;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Login Section */
    .login-section {
      background: #ffffff;
      padding: 50px 30px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 450px;
      margin: 60px auto;
    }

    .login-section h1 {
      color: #0f172a;
      margin-bottom: 8px;
      font-size: 26px;
    }

    .login-section p {
      color: #64748b;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .login-form input {
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-form input:focus {
      border-color: #f8512b;
      box-shadow: 0 0 0 3px rgba(248, 81, 43, 0.15);
    }

    .login-btn {
      padding: 14px;
      background: #f8512b;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: #e0411d;
    }

    /* Dashboard Section */
    .dashboard {
      display: none;
    }

    .dashboard.active {
      display: block;
    }

    .dashboard-header {
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 16px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .dashboard-header h1 {
      font-size: 24px;
      color: #0f172a;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .stat-number {
      font-size: 26px;
      font-weight: 700;
      color: #f8512b;
    }

    .stat-label {
      font-size: 13px;
      color: #64748b;
    }

    .logout-btn {
      padding: 10px 20px;
      background: #e2e8f0;
      color: #1e293b;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: #cbd5e1;
    }

    .error-message {
      background: #ef4444;
      color: white;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
      font-weight: 500;
    }

    .error-message.show {
      display: block;
    }

    /* Submissions List */
    .submissions-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .submission-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }

    .submission-card:hover {
      transform: translateY(-2px);
    }

    .submission-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .submission-name {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }

    .submission-email {
      font-size: 14px;
      color: #64748b;
      margin-top: 2px;
    }

    .submission-time {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .delete-btn {
      padding: 8px 16px;
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .delete-btn:hover {
      background: #dc2626;
      color: white;
    }

    .submission-message {
      color: #334155;
      line-height: 1.6;
      font-size: 15px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 8px;
      border-left: 4px solid #f8512b;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* Attachment Preview Styling */
    .attachment-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed #e2e8f0;
    }

    .attachment-title {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .attachment-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      color: #0f172a;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .attachment-link:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
      color: #f8512b;
    }

    .attachment-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #10b981;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.2);
    }

    .download-btn:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .view-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #f1f5f9;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .view-btn:hover {
      background: #e2e8f0;
      color: #f8512b;
    }

    .attachment-image-preview {
      display: block;
      margin-top: 10px;
      max-width: 280px;
      max-height: 200px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .attachment-image-preview:hover {
      transform: scale(1.02);
    }

    .empty-state {
      background: white;
      padding: 60px 30px;
      border-radius: 14px;
      text-align: center;
      color: #64748b;
    }

    .empty-state h2 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #1e293b;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Section -->
    <div class="login-section" id="login-section">
      <h1>🔐 Admin Dashboard</h1>
      <p>Enter your admin password to view received notes</p>
      <div class="login-form">
        <input 
          type="password" 
          id="admin-password" 
          placeholder="Enter admin password"
          autocomplete="current-password"
        >
        <button class="login-btn" onclick="login()">Login</button>
      </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard" class="dashboard">
      <div class="dashboard-header">
        <div>
          <h1>📬 Visitor Submissions</h1>
          <div class="stats" id="stats">
            <div>
              <span class="stat-number" id="total-count">0</span>
              <div class="stat-label">Total Messages</div>
            </div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <div class="error-message" id="error-message"></div>

      <div class="submissions-grid" id="submissions-grid"></div>
    </div>
  </div>

  <script>
    const isLocal = window.location.hostname === 'localhost' || 
                    window.location.hostname === '127.0.0.1' || 
                    window.location.protocol === 'file:' ||
                    window.location.hostname === '';

    const BACKEND_URL = isLocal
      ? 'http://localhost:5000'
      : 'https://portfolio-backend-oj6i.onrender.com';

    async function login() {
      const password = document.getElementById('admin-password').value;

      if (!password) {
        showError('Please enter a password');
        return;
      }

      try {
        const response = await fetch(`${BACKEND_URL}/api/get-submissions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ adminPassword: password })
        });

        const data = await response.json();

        if (response.ok) {
          sessionStorage.setItem('adminPassword', password);
          showDashboard(data.submissions);
        } else {
          showError('❌ ' + (data.error || 'Incorrect password'));
        }
      } catch (error) {
        showError('❌ Connection error. Make sure your backend server is running.');
        console.error('Login error:', error);
      }
    }

    function showDashboard(submissions) {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('dashboard').classList.add('active');
      renderSubmissions(submissions);
    }

    function formatFileSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function renderSubmissions(submissions) {
      const grid = document.getElementById('submissions-grid');
      const totalCount = document.getElementById('total-count');

      totalCount.textContent = submissions.length;

      if (submissions.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h2>📭 No notes yet</h2>
            <p>Messages will appear here as soon as someone submits a note through your contact form.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = submissions
        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
        .map(submission => {
          let attachmentHtml = '';
          if (submission.attachment && submission.attachment.url) {
            const fileUrl = submission.attachment.url.startsWith('http') 
              ? submission.attachment.url 
              : `${BACKEND_URL}${submission.attachment.url}`;
            const fileTarget = submission.attachment.fileId || encodeURIComponent(submission.attachment.filename);
            const downloadUrl = `${BACKEND_URL}/api/download/${fileTarget}?name=${encodeURIComponent(submission.attachment.originalName || submission.attachment.filename || 'file')}`;
            const isImage = submission.attachment.mimeType && submission.attachment.mimeType.startsWith('image/');
            const formattedSize = formatFileSize(submission.attachment.size);

            attachmentHtml = `
              <div class="attachment-section">
                <div class="attachment-title">📎 Attached File: <strong>${escapeHtml(submission.attachment.originalName || 'File')}</strong> ${formattedSize ? `<span style="color:#64748b; font-size:12px;">(${formattedSize})</span>` : ''}</div>
                
                <div class="attachment-actions">
                  <a href="${downloadUrl}" download="${escapeHtml(submission.attachment.originalName || 'file')}" class="download-btn">
                    <span>⬇️ Download File</span>
                  </a>
                  <a href="${fileUrl}" target="_blank" rel="noopener noreferrer" class="view-btn">
                    <span>👁️ Open / Preview</span>
                  </a>
                </div>

                ${isImage ? `
                  <div>
                    <a href="${fileUrl}" target="_blank" rel="noopener noreferrer" title="Click to view full image">
                      <img src="${fileUrl}" alt="Attachment preview" class="attachment-image-preview" loading="lazy">
                    </a>
                  </div>
                ` : ''}
              </div>
            `;
          }

          return `
            <div class="submission-card">
              <div class="submission-header">
                <div class="submission-info">
                  <div class="submission-name">👤 ${escapeHtml(submission.name)}</div>
                  <div class="submission-email">✉️ ${escapeHtml(submission.email)}</div>
                  <div class="submission-time">🕒 ${new Date(submission.timestamp).toLocaleString()}</div>
                </div>
                <button class="delete-btn" onclick="deleteSubmission(${submission.id})">🗑️ Delete</button>
              </div>
              <div class="submission-message">${escapeHtml(submission.message).replace(/\n/g, '<br>')}</div>
              ${attachmentHtml}
            </div>
          `;
        }).join('');
    }

    async function deleteSubmission(id) {
      if (!confirm('Are you sure you want to delete this submission?')) return;

      const password = sessionStorage.getItem('adminPassword');

      try {
        const response = await fetch(`${BACKEND_URL}/api/delete-submission`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ adminPassword: password, submissionId: id })
        });

        const data = await response.json();

        if (response.ok) {
          // Reload submissions
          const submitResponse = await fetch(`${BACKEND_URL}/api/get-submissions`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ adminPassword: password })
          });

          const submitData = await submitResponse.json();
          if (submitResponse.ok) {
            renderSubmissions(submitData.submissions);
          }
        } else {
          showError('❌ ' + (data.error || 'Failed to delete submission'));
        }
      } catch (error) {
        showError('❌ Error deleting submission');
        console.error('Delete error:', error);
      }
    }

    function logout() {
      sessionStorage.removeItem('adminPassword');
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('dashboard').classList.remove('active');
      document.getElementById('admin-password').value = '';
    }

    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      setTimeout(() => {
        errorDiv.classList.remove('show');
      }, 4000);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.toString().replace(/[&<>"']/g, m => map[m]);
    }

    // Auto-login if session password exists
    window.addEventListener('load', () => {
      const password = sessionStorage.getItem('adminPassword');
      if (password) {
        fetch(`${BACKEND_URL}/api/get-submissions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ adminPassword: password })
        })
        .then(r => r.json())
        .then(data => {
          if (data.submissions) {
            showDashboard(data.submissions);
          }
        })
        .catch(console.error);
      }
    });
  </script>
</body>
</html>
