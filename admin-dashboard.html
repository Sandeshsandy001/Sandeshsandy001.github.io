
<!-- Admin Dashboard - Access at http://your-site.com/admin -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .login-section {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .login-section h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .login-section p {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .login-form {
      display: flex;
      gap: 10px;
      max-width: 400px;
      margin: 0 auto;
    }

    .login-form input {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .login-form input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .login-btn {
      padding: 12px 30px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }

    .dashboard {
      display: none;
    }

    .dashboard.active {
      display: block;
    }

    .dashboard-header {
      background: white;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dashboard-header h1 {
      color: #333;
      font-size: 24px;
    }

    .logout-btn {
      padding: 10px 20px;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: #da190b;
    }

    .submissions-grid {
      display: grid;
      gap: 20px;
    }

    .submission-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      border-left: 4px solid #667eea;
    }

    .submission-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .submission-info {
      flex: 1;
    }

    .submission-name {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .submission-email {
      font-size: 13px;
      color: #666;
      margin-bottom: 3px;
    }

    .submission-time {
      font-size: 12px;
      color: #999;
    }

    .delete-btn {
      padding: 8px 15px;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .delete-btn:hover {
      background: #da190b;
      transform: scale(1.05);
    }

    .submission-message {
      color: #444;
      line-height: 1.6;
      font-size: 14px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 6px;
      border-left: 3px solid #667eea;
      white-space: pre-wrap;       
      word-wrap: break-word;
    }

    .empty-state {
      background: white;
      padding: 60px 30px;
      border-radius: 12px;
      text-align: center;
      color: #999;
    }

    .empty-state h2 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #666;
    }

    .stats {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      gap: 30px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .stat-number {
      font-size: 32px;
      font-weight: 700;
      color: #667eea;
    }

    .stat-label {
      font-size: 14px;
      color: #666;
    }

    .error-message {
      background: #f44336;
      color: white;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }

    .error-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Section -->
    <div class="login-section" id="login-section">
      <h1>🔐 Admin Dashboard</h1>
      <p>Enter your password to view submitted notes</p>
      <div class="login-form">
        <input 
          type="password" 
          id="admin-password" 
          placeholder="Enter admin password"
        >
        <button class="login-btn" onclick="login()">Login</button>
      </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard" class="dashboard">
      <div class="dashboard-header">
        <div>
          <h1>📨 Your Notes</h1>
          <div class="stats" id="stats">
            <div class="stat">
              <div class="stat-number" id="total-count">0</div>
              <div class="stat-label">Total Messages</div>
            </div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <div class="error-message" id="error-message"></div>

      <div class="submissions-grid" id="submissions-grid"></div>
    </div>
  </div>

  <script>
    // Change this to your actual backend URL
    const BACKEND_URL = 'https://portfolio-backend-oj6i.onrender.com'; // or your website URL

    async function login() {
      const password = document.getElementById('admin-password').value;

      if (!password) {
        showError('Please enter a password');
        return;
      }

      try {
        const response = await fetch(`${BACKEND_URL}/api/get-submissions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ adminPassword: password })
        });

        const data = await response.json();

        if (response.ok) {
          sessionStorage.setItem('adminPassword', password);
          showDashboard(data.submissions);
        } else {
          showError('❌ Incorrect password');
        }
      } catch (error) {
        showError('❌ Connection error. Make sure your backend is running.');
        console.error('Error:', error);
      }
    }

    function showDashboard(submissions) {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('dashboard').classList.add('active');
      renderSubmissions(submissions);
    }

    function renderSubmissions(submissions) {
      const grid = document.getElementById('submissions-grid');
      const totalCount = document.getElementById('total-count');

      totalCount.textContent = submissions.length;

      if (submissions.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h2>📭 No notes yet</h2>
            <p>Messages will appear here when someone submits a note through your form.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = submissions
        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
        .map(submission => `
          <div class="submission-card">
            <div class="submission-header">
              <div class="submission-info">
                <div class="submission-name">👤 ${escapeHtml(submission.name)}</div>
                <div class="submission-email">📧 ${escapeHtml(submission.email)}</div>
                <div class="submission-time">🕐 ${new Date(submission.timestamp).toLocaleString()}</div>
              </div>
              <button class="delete-btn" onclick="deleteSubmission(${submission.id})">🗑️ Delete</button>
            </div>
            <div class="submission-message">${escapeHtml(submission.message).replace(/\n/g, '<br>')}</div>
          </div>
        `).join('');
    }

    async function deleteSubmission(id) {
      if (!confirm('Are you sure you want to delete this submission?')) return;

      const password = sessionStorage.getItem('adminPassword');

      try {
        const response = await fetch(`${BACKEND_URL}/api/delete-submission`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ adminPassword: password, submissionId: id })
        });

        const data = await response.json();

        if (response.ok) {
          // Reload submissions
          const submitResponse = await fetch(`${BACKEND_URL}/api/get-submissions`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ adminPassword: password })
          });

          const submitData = await submitResponse.json();
          if (submitResponse.ok) {
            renderSubmissions(submitData.submissions);
          }
        }
      } catch (error) {
        showError('Error deleting submission');
        console.error('Error:', error);
      }
    }

    function logout() {
      sessionStorage.removeItem('adminPassword');
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('dashboard').classList.remove('active');
      document.getElementById('admin-password').value = '';
    }

    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      setTimeout(() => {
        errorDiv.classList.remove('show');
      }, 4000);
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Check if already logged in
    window.addEventListener('load', () => {
      const password = sessionStorage.getItem('adminPassword');
      if (password) {
        // Try to reload submissions
        fetch(`${BACKEND_URL}/api/get-submissions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ adminPassword })
        })
        .then(r => r.json())
        .then(data => {
          if (data.submissions) {
            showDashboard(data.submissions);
          }
        });
      }
    });
  </script>
</body>
</html>
